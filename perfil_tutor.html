<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Tutor - EduConecta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body id="perfil-page">

    <header class="header">
        <nav class="nav container">
            <a href="dashboard.html" class="nav__logo">&larr; Retour à la recherche</a>
            <div class="nav__profile">
                <span>Bienvenue</span>
                <img src="img/sebas.jpeg" alt="Foto de Perfil" class="nav__profile-img">
            </div>
        </nav>
    </header>

    <main class="container profile-grid">
        <div class="tutor-details">
            <div class="tutor-intro">
                <img src="" alt="Foto de Tutor" class="tutor-intro__img" id="tutor-img">
                <div class="tutor-intro__info">
                    <h1 id="tutor-name">Cargando...</h1>
                    <p class="tutor-intro__sub" id="tutor-subtitle"></p>
                    <div class="tutor-intro__rating" id="tutor-rating"></div>
                </div>
            </div>

            <div class="tutor-section">
                <h2>À propos de moi</h2>
                <p id="tutor-bio"></p>
            </div>

            <div class="tutor-section">
                <h2>Matières enseignées</h2>
                <div class="tutor-tags" id="tutor-tags"></div>
            </div>

            <div class="tutor-section">
                <h2>Avis des étudiants</h2>
                <div id="reviews-container">
                    </div>
            </div>
        </div>

        <aside class="booking-widget">
            <div class="booking-widget__price" id="tutor-price"></div>
            <hr>
            
            <div id="calendar-container">
                <p class="booking-widget__label">1. Sélectionnez une date</p>
                <div class="calendar-header">
                    <button id="prev-month">&lt;</button>
                    <h3 id="month-year"></h3>
                    <button id="next-month">&gt;</button>
                </div>
                <div class="calendar-weekdays">
                    <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                </div>
                <div class="calendar-days" id="calendar-days"></div>
            </div>

            <div class="time-slots-container" id="time-slots-container" style="display: none;">
                <p class="booking-widget__label">2. Choisissez une heure</p>
                <div id="time-slots" class="time-slots"></div>
            </div>

            <div class="duration-selector" id="duration-container" style="display: none;">
                 <p class="booking-widget__label">3. Définissez la durée</p>
                <select id="duration">
                    <option value="1">1 heure</option>
                    <option value="1.5">1 heure et demies</option>
                    <option value="2">2 heures</option>
                </select>
            </div>

            <div class="booking-summary" id="booking-summary" style="display: none;">
                <div class="summary-line">
                    <span>Sous-total:</span>
                    <span id="summary-subtotal"></span>
                </div>
                 <div class="summary-line">
                    <span>Tarif du service:</span>
                    <span id="summary-fee"></span>
                </div>
                <div class="summary-line total">
                    <span>Total à payer:</span>
                    <span id="summary-total"></span>
                </div>
            </div>

            <button class="button button--primary button--full" id="book-button" disabled>Payer</button>

            <div class="accepted-payments">
                <p>Paiements sécurisés avec:</p>
                <div class="payment-icons">
                     <img src="img/nequi.png" alt="Nequi">
                     <img src="img/daviplata.png" alt="Daviplata">
                     <img src="img/PSE.png" alt="PSE">
                </div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
