<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Tutores - EduConecta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body id="dashboard-page">

    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">EduConnecte</a>
            <div class="nav__profile">
                <span>Bienvenue</span>
                <img src="img/sebas.jpeg" alt="Foto de Perfil" class="nav__profile-img">
            </div>
        </nav>
    </header>

    <main>
        <section class="search-section">
            <div class="container">
                <h1>Trouvez votre tuteur idéal sur la côte</h1>
                <form class="filters" id="filters" onsubmit="return false;">
                    <div class="filter-group">
                        <input type="search" id="search-name" placeholder="Rechercher par nom : Valentina, Carlos...">
                    </div>
                    <div class="filter-group">
                        <select id="filter-materia">
                            <option value="">Toutes les matières</option>
                            <option value="Cálculo">Calcul</option>
                            <option value="Álgebra">Algèbre</option>
                            <option value="Física">Physique</option>
                            <option value="Química">Chimie</option>
                            <option value="Biología">Biologie</option>
                            <option value="Inglés">Anglais</option>
                            <option value="Sociales">Ciencias Sociales</option>
                        </select>
                    </div>
                    <div class="filter-group">
                         <select id="filter-universidad">
                            <option value="">Toutes les universités</option>
                            <option value="Universidad del Norte">Universidad del Norte</option>
                            <option value="Universidad de Cartagena">Universidad de Cartagena</option>
                            <option value="Universidad Tecnológica de Bolívar">Universidad Tecnológica de Bolívar</option>
                            <option value="Universidad del Atlántico">Universidad del Atlántico</option>
                        </select>
                    </div>
                </form>
            </div>
        </section>

        <section class="tutors-section">
            <div class="container">
                <h2 id="tutors-heading">Tuteurs disponibles</h2>
                <div class="tutor-grid" id="tutor-grid">
                    </div>
                 <p id="no-results" style="display: none; text-align: center; padding: 40px; font-size: 1.2rem; color: #888;">Aucun tuteur correspondant à votre recherche n'a été trouvé.</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container container">
            <p>&copy; 2025 EduConecta. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
